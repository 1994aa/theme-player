<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c0f2e">
<meta name="description" content="Truck, Kitchen ya Saloon: theme chuno aur gaane suno, scene beat pe naachta hai.">
<title>Dhun · Theme Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,WONK@0,9..144,400..700,0;1,9..144,400..700,0&family=Outfit:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="brand" href="#">dhun<b>.</b></a>
    <nav id="tabs" aria-label="Themes"></nav>
  </header>

  <main>
    <section id="home">
      <div class="hero">
        <span class="eyebrow">Gaana wahi, mahaul naya</span>
        <h1>Aaj kahan <em>sunoge?</em></h1>
        <p>Theme chuno, gaana chalao. Truck ho, rasoi ho, taaron bhari raat, pahadon ki chai ya nai ki dukaan, scene music ki beat pe naachega.</p>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <section id="stage" hidden>
      <div class="scene" id="scene"></div>
      <aside class="player">
        <div class="ytbox" id="ytBox"><div id="ytPlayer"></div></div>
        <div class="listbox" id="listBox" hidden>
          <div class="scope" id="scope"></div>
          <input type="search" id="search" placeholder="🔍 Gaana, singer ya film dhoondo…" autocomplete="off" aria-label="Gaana dhoondo">
          <ol class="list" id="list"></ol>
        </div>
        <div class="bar">
          <div class="meta">
            <span class="eyebrow" id="themeTime"></span>
            <strong id="title" title="Song list dekho">Koi gaana nahi chal raha</strong>
            <small id="count">—</small>
          </div>
          <div class="controls">
            <button id="shuffle" title="Shuffle" aria-pressed="false">🔀</button>
            <button id="prev" title="Pichhla gaana">⏮</button>
            <button id="play" class="big" title="Play / Pause">▶</button>
            <button id="next" title="Agla gaana">⏭</button>
          </div>
          <div class="side">
            <div class="eq" id="eq" aria-hidden="true"></div>
            <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" aria-label="Volume">
            <button id="srcBtn" hidden title="YouTube ya local gaane">▶ YouTube</button>
            <button id="listBtn" title="Song list" aria-expanded="false" aria-controls="list">☰</button>
          </div>
        </div>
        <div class="progress"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Gaane mein aage-peeche"><span id="dur">0:00</span></div>
      </aside>
    </section>
  </main>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
